<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro Web</title>
    
    <link rel="preload" href="love.min.js" as="script">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
        }
        
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-title {
            color: #e94560;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        
        .progress-container {
            width: 300px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.3s ease;
        }
        
        #loader-text {
            color: #eee;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        #autosave-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.7);
            color: #4ade80;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        
        #autosave-indicator.visible {
            opacity: 1;
        }
        
        #save-controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: none;
        }
        
        .save-btn {
            background: rgba(233, 69, 96, 0.8);
            border: none;
            color: white;
            padding: 8px 16px;
            margin-right: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        
        .save-btn:hover {
            background: rgba(233, 69, 96, 1);
        }
    </style>
    
    <script src="love.min.js"></script>
</head>
<body>
    <div id="loader">
        <div class="loader-title">BALATRO</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="loader-text">Loading modules...</div>
    </div>
    
    <div id="autosave-indicator">💾 Synced</div>
    
    <div id="save-controls">
        <button class="save-btn" onclick="syncSaves()">💾 Force Save</button>
        <button class="save-btn" onclick="exportSave()">📤 Export</button>
        <button class="save-btn" onclick="importSave()">📥 Import</button>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script>
        const moduleFiles = [
            "module.part1.js", "module.part2.js", "module.part3.js",
            "module.part4.js", "module.part5.js", "module.part6.js", "module.part7.js"
        ];
        
        const progressBar = document.getElementById('progress-bar');
        const loaderText = document.getElementById('loader-text');
        const loader = document.getElementById('loader');
        const canvas = document.getElementById('canvas');
        
        // Balatro's save directory (LÖVE uses identity for folder name)
        const SAVE_DIR = '/home/web_user/.local/share/love/Balatro';
        let saveSyncInterval;
        
        async function loadModules() {
            const parts = [];
            for (let i = 0; i < moduleFiles.length; i++) {
                try {
                    loaderText.textContent = `Loading module ${i + 1} of ${moduleFiles.length}...`;
                    const response = await fetch(moduleFiles[i]);
                    if (!response.ok) throw new Error(`Failed to load ${moduleFiles[i]}`);
                    parts.push(await response.text());
                    progressBar.style.width = (((i + 1) / moduleFiles.length) * 100) + '%';
                } catch (err) {
                    console.error(err);
                    loaderText.textContent = `Retrying module ${i + 1}...`;
                    i--;
                    await new Promise(r => setTimeout(r, 1000));
                }
            }
            loaderText.textContent = 'Initializing...';
            const script = document.createElement('script');
            script.text = parts.join('');
            document.head.appendChild(script);
        }
        
        // Mount IDBFS and sync FROM IndexedDB (load existing saves)
        function mountAndLoadSaves() {
            return new Promise((resolve, reject) => {
                try {
                    // Create save directory
                    Module.FS.mkdirTree(SAVE_DIR);
                    
                    // Mount IDBFS for persistence
                    Module.FS.mount(Module.FS.filesystems.IDBFS, {}, SAVE_DIR);
                    
                    console.log('Mounted IDBFS, syncing from storage...');
                    loaderText.textContent = 'Loading save data...';
                    
                    // syncfs(true) = load FROM IndexedDB TO filesystem
                    Module.FS.syncfs(true, (err) => {
                        if (err) {
                            console.error('Sync error:', err);
                            reject(err);
                        } else {
                            console.log('Save data loaded from IndexedDB');
                            
                            // List what we loaded
                            try {
                                const files = Module.FS.readdir(SAVE_DIR);
                                console.log('Save files found:', files.filter(f => f !== '.' && f !== '..'));
                            } catch (e) {
                                console.log('No existing saves');
                            }
                            
                            resolve();
                        }
                    });
                } catch (err) {
                    console.error('Mount error:', err);
                    reject(err);
                }
            });
        }
        
        // Sync TO IndexedDB (save current state)
        function syncSaves() {
    if (!Module.FS) return;
    Module.FS.syncfs(false, function(err) {
        if (err) console.error('Save sync error:', err);
        else {
            console.log('Saved to IndexedDB');
            const indicator = document.getElementById('autosave-indicator');
            indicator.classList.add('visible');
            setTimeout(function() { indicator.classList.remove('visible'); }, 2000);
        }
    });
}
        
        // Export saves to file
        function exportSave() {
    if (!Module.FS) return alert('Game not loaded');
    try {
        var files = Module.FS.readdir(SAVE_DIR).filter(function(f) { 
            return f !== '.' && f !== '..'; 
        });
        var exportData = {};
        
        for (var i = 0; i < files.length; i++) {
            var file = files[i];
            var path = SAVE_DIR + '/' + file;
            var content = Module.FS.readFile(path);
            exportData[file] = Array.from(content);
        }
        
        var blob = new Blob([JSON.stringify(exportData)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'balatro-backup-' + new Date().toISOString().slice(0,10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
    } catch (err) {
        alert('Export failed: ' + err.message);
    }
}

function importSave() {
    if (!Module.FS) return alert('Game not loaded');
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        
        var reader = new FileReader();
        reader.onload = function(event) {
            try {
                var data = JSON.parse(event.target.result);
                for (var name in data) {
                    if (data.hasOwnProperty(name)) {
                        Module.FS.writeFile(SAVE_DIR + '/' + name, new Uint8Array(data[name]));
                    }
                }
                syncSaves();
                alert('Imported! Reload page to load the save.');
            } catch (err) {
                alert('Import failed: ' + err.message);
            }
        };
        reader.readAsText(file);
    };
    input.click();
}
        
        (async () => {
            try {
                await loadModules();
                const d = await getSource();
                
                window.Module = {
    INITIAL_MEMORY: 268435456,
    ALLOW_MEMORY_GROWTH: 1,
    canvas: canvas,
    printErr: console.error,
    arguments: ["game.love"],
    
    preRun: [function() {
        Module.addRunDependency("fp game.love");
        Module.addRunDependency("mount_idbfs");
        
        // Create game.love file
        Module.FS_createDataFile('/', "game.love", d, true, true, true);
        Module.removeRunDependency("fp game.love");
        
        // Mount IDBFS synchronously, then async sync
        try {
            Module.FS.mkdirTree(SAVE_DIR);
            Module.FS.mount(Module.FS.filesystems.IDBFS, {}, SAVE_DIR);
            
            // syncfs(true) = load FROM IndexedDB
            Module.FS.syncfs(true, function(err) {
                if (err) console.error('Sync error:', err);
                else console.log('Save data loaded');
                Module.removeRunDependency("mount_idbfs");
            });
        } catch (err) {
            console.error('Mount error:', err);
            Module.removeRunDependency("mount_idbfs");
        }
    }],
    
    postRun: [function() {
        // Auto-sync every 30 seconds
        saveSyncInterval = setInterval(function() {
            if (Module.FS) {
                Module.FS.syncfs(false, function(err) {
                    if (err) console.error('Autosave error:', err);
                    else {
                        const indicator = document.getElementById('autosave-indicator');
                        indicator.classList.add('visible');
                        setTimeout(function() { indicator.classList.remove('visible'); }, 2000);
                    }
                });
            }
        }, 30000);
        
        // Sync on page hide
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && Module.FS) {
                Module.FS.syncfs(false, function(err) {
                    if (err) console.error('Visibility sync error:', err);
                });
            }
        });
        
        document.getElementById('save-controls').style.display = 'block';
        loader.classList.add('hidden');
        canvas.style.display = 'block';
    }]
};
                
                Love(Module);
            } catch (err) {
                console.error(err);
                loaderText.textContent = 'Error: ' + err.message;
                loaderText.style.color = '#e94560';
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('SW registered'))
                .catch(e => console.log('SW failed:', e));
        }
    </script>
</body>
</html>
