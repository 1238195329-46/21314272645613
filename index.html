<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro Web</title>
    
    <link rel="preload" href="love.min.js" as="script">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: none;
        }
        
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }
        
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loader-title {
            color: #e94560;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }
        
        .progress-container {
            width: 300px;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }
        
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.3s ease;
        }
        
        #loader-text {
            color: #eee;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        #autosave-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 8px 16px;
            background: rgba(0,0,0,0.7);
            color: #4ade80;
            border-radius: 20px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
            pointer-events: none;
        }
        
        #autosave-indicator.visible {
            opacity: 1;
        }
        
        #save-controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 100;
            display: none;
        }
        
        .save-btn {
            background: rgba(233, 69, 96, 0.8);
            border: none;
            color: white;
            padding: 8px 16px;
            margin-right: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        
        .save-btn:hover {
            background: rgba(233, 69, 96, 1);
        }
    </style>
    
    <script>
        const PREFIX = "Balatro_Vanilla_";
        const originalOpen = indexedDB.open;
        const originalDeleteDatabase = indexedDB.deleteDatabase;
        const prefixCache = new Map();
        
        function getPrefixedName(name) {
            if (!prefixCache.has(name)) {
                prefixCache.set(name, PREFIX + name);
            }
            return prefixCache.get(name);
        }
        
        indexedDB.open = function(name, version) {
            const prefixedName = getPrefixedName(name);
            return version !== undefined 
                ? originalOpen.call(this, prefixedName, version)
                : originalOpen.call(this, prefixedName);
        };
        
        indexedDB.deleteDatabase = function(name) {
            const prefixedName = getPrefixedName(name);
            return originalDeleteDatabase.call(this, prefixedName);
        };
    </script>
    
    <script src="love.min.js"></script>
</head>
<body>
    <div id="loader">
        <div class="loader-title">BALATRO</div>
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>
        <div id="loader-text">Loading modules...</div>
    </div>
    
    <div id="autosave-indicator">💾 Auto-saved</div>
    
    <div id="save-controls">
        <button class="save-btn" onclick="saveManager.manualSave()">💾 Save Now</button>
        <button class="save-btn" onclick="saveManager.exportSave()">📤 Export</button>
        <button class="save-btn" onclick="saveManager.importSave()">📥 Import</button>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <script>
        const moduleFiles = [
            "module.part1.js",
            "module.part2.js", 
            "module.part3.js",
            "module.part4.js",
            "module.part5.js",
            "module.part6.js",
            "module.part7.js"
        ];
        
        const progressBar = document.getElementById('progress-bar');
        const loaderText = document.getElementById('loader-text');
        const loader = document.getElementById('loader');
        const canvas = document.getElementById('canvas');
        
        async function loadModules() {
            const parts = [];
            for (let i = 0; i < moduleFiles.length; i++) {
                try {
                    loaderText.textContent = `Loading module ${i + 1} of ${moduleFiles.length}...`;
                    const response = await fetch(moduleFiles[i]);
                    if (!response.ok) throw new Error(`Failed to load ${moduleFiles[i]}`);
                    parts.push(await response.text());
                    progressBar.style.width = (((i + 1) / moduleFiles.length) * 100) + '%';
                } catch (err) {
                    console.error(err);
                    loaderText.textContent = `Retrying module ${i + 1}...`;
                    i--;
                    await new Promise(r => setTimeout(r, 1000));
                }
            }
            loaderText.textContent = 'Initializing...';
            const script = document.createElement('script');
            script.text = parts.join('');
            document.head.appendChild(script);
        }
        
        const saveManager = {
            DB_NAME: 'BalatroSaves',
            STORE_NAME: 'saveData',
            db: null,
            
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.DB_NAME, 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => { this.db = request.result; resolve(); };
                    request.onupgradeneeded = (e) => {
                        e.target.result.createObjectStore(this.STORE_NAME, { keyPath: 'slot' });
                    };
                });
            },
            
            async save(slot = 'auto', data = null) {
                if (!this.db) return;
                try {
                    if (!data && window.Module?.FS) {
                        data = await this.captureGameState();
                    }
                    if (!data) return;
                    
                    const tx = this.db.transaction([this.STORE_NAME], 'readwrite');
                    const store = tx.objectStore(this.STORE_NAME);
                    await new Promise((res, rej) => {
                        const req = store.put({ slot, data, timestamp: Date.now() });
                        req.onsuccess = () => res();
                        req.onerror = () => rej(req.error);
                    });
                    
                    const indicator = document.getElementById('autosave-indicator');
                    indicator.classList.add('visible');
                    setTimeout(() => indicator.classList.remove('visible'), 2000);
                } catch (err) {
                    console.error('Save failed:', err);
                }
            },
            
            async load(slot = 'auto') {
                if (!this.db) return null;
                try {
                    const tx = this.db.transaction([this.STORE_NAME], 'readonly');
                    const store = tx.objectStore(this.STORE_NAME);
                    const result = await new Promise((res, rej) => {
                        const req = store.get(slot);
                        req.onsuccess = () => res(req.result);
                        req.onerror = () => rej(req.error);
                    });
                    return result?.data || null;
                } catch (err) {
                    console.error('Load failed:', err);
                    return null;
                }
            },
            
            async captureGameState() {
                if (!window.Module?.FS) return null;
                try {
                    const saveDir = '/home/web_user/.local/share/love/game/save';
                    const files = window.Module.FS.readdir(saveDir);
                    const data = {};
                    for (const file of files) {
                        if (file === '.' || file === '..') continue;
                        data[file] = Array.from(window.Module.FS.readFile(saveDir + '/' + file));
                    }
                    return data;
                } catch (e) {
                    return null;
                }
            },
            
            async restoreGameState(saveData) {
                if (!window.Module?.FS || !saveData) return;
                try {
                    const saveDir = '/home/web_user/.local/share/love/game/save';
                    try { window.Module.FS.mkdirTree(saveDir); } catch (e) {}
                    for (const [name, content] of Object.entries(saveData)) {
                        window.Module.FS.writeFile(saveDir + '/' + name, new Uint8Array(content));
                    }
                } catch (err) {
                    console.error('Restore failed:', err);
                }
            },
            
            manualSave() {
                this.save('manual_' + Date.now());
                alert('Saved!');
            },
            
            async exportSave() {
                const data = await this.load('auto');
                if (!data) return alert('No save data!');
                const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `balatro-save-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            },
            
            importSave() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    try {
                        const data = JSON.parse(await file.text());
                        await this.save('auto', data);
                        await this.restoreGameState(data);
                        alert('Imported!');
                    } catch (err) {
                        alert('Import failed: ' + err.message);
                    }
                };
                input.click();
            },
            
            startAutoSave() {
                setInterval(() => this.save('auto'), 30000);
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) this.save('auto');
                });
                window.addEventListener('beforeunload', () => this.save('auto'));
            }
        };
        
        (async () => {
            try {
                await loadModules();
                await saveManager.init();
                const d = await getSource();
                
                window.Module = {
                    INITIAL_MEMORY: 268435456,
                    ALLOW_MEMORY_GROWTH: 1,
                    canvas: canvas,
                    printErr: console.error,
                    arguments: ["game.love"],
                    
                    preRun: [function() {
                        Module.addRunDependency("fp game.love");
                        Module.FS_createDataFile('/', "game.love", d, true, true, true);
                        Module.removeRunDependency("fp game.love");
                    }],
                    
                    postRun: [function() {
                        saveManager.load('auto').then(data => {
                            if (data) setTimeout(() => saveManager.restoreGameState(data), 500);
                        });
                        saveManager.startAutoSave();
                        document.getElementById('save-controls').style.display = 'block';
                        loader.classList.add('hidden');
                        canvas.style.display = 'block';
                    }]
                };
                
                Love(Module);
            } catch (err) {
                console.error(err);
                loaderText.textContent = 'Error: ' + err.message;
                loaderText.style.color = '#e94560';
            }
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(r => console.log('SW registered'))
                .catch(e => console.log('SW failed:', e));
        }
    </script>
</body>
</html>
